name: Сборка MoexScanner.exe

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.11.1

      - name: Проверка кода
        run: python -c "import scanner, app; print('ok')"

      # Сервер госуслуг может не отвечать зарубежным адресам — тогда программа скачает сертификаты сама
      - name: Сертификаты НУЦ Минцифры (попытка, не обязательно)
        continue-on-error: true
        run: python tools/get_ru_certs.py certs

      - name: Папка certs для сборки
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path certs | Out-Null
          Set-Content -Path certs/README.txt -Value "Сертификаты НУЦ Минцифры для проверки соединений. В Windows не устанавливаются."

      - name: Номер версии
        shell: pwsh
        run: |
          $when = (Get-Date).ToUniversalTime().AddHours(3).ToString("dd.MM.yyyy HH:mm")
          Set-Content -Path version.txt -Value ("${{ github.sha }}".Substring(0, 7) + " от " + $when + " МСК") -Encoding utf8

      - name: Программа для сервера (ставится на VPS из exe)
        run: python -c "import serverinstall as si; open('server_bundle.zip','wb').write(si.bundle_bytes())"

      - name: Сборка .exe
        run: pyinstaller --noconfirm --onefile --windowed --name MoexScanner --add-data "certs;certs" --add-data "version.txt;." --add-data "server_bundle.zip;." app.py

      - name: Архив с инструкцией
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/MoexScanner.exe release/
          Copy-Item README.md release/
          Compress-Archive -Path release/* -DestinationPath MoexScanner-windows.zip -Force

      # Хранилище артефактов ограничено на весь аккаунт — не даём ему ломать сборку
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: MoexScanner-windows
          path: MoexScanner-windows.zip
          retention-days: 3

      - name: Релиз «latest» (постоянная ссылка на последнюю сборку)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes 2>$null
          $global:LASTEXITCODE = 0
          $sha = "${{ github.sha }}".Substring(0, 7)
          $when = (Get-Date).ToUniversalTime().AddHours(3).ToString("dd.MM.yyyy HH:mm")
          gh release create latest MoexScanner-windows.zip --target "${{ github.sha }}" `
            --title "Последняя сборка ($when МСК)" `
            --notes "Сборка из коммита $sha. Скачайте MoexScanner-windows.zip, распакуйте в отдельную папку и запустите MoexScanner.exe." `
            --latest

      - name: Релиз (для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MoexScanner-windows.zip

  android:
    # APK для телефона собирается после exe и добавляется в тот же релиз «latest»
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Сборка APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_FILE: ${{ github.workspace }}/android/release.jks
          KEYSTORE_PASSWORD: "t72fRU_gaU53Pm7wKfphPo9i"
          KEY_ALIAS: moexrobot
          KEY_PASSWORD: "t72fRU_gaU53Pm7wKfphPo9i"
        run: |
          export VERSION_NAME="$(echo ${{ github.sha }} | cut -c1-7) от $(TZ=Europe/Moscow date +'%d.%m.%Y %H:%M')"
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../MoexRobot-android.apk

      - name: APK в релиз «latest»
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload latest MoexRobot-android.apk --clobber
