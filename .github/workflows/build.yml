name: Сборка MoexScanner.exe

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.10.0

      - name: Проверка кода
        run: python -c "import scanner, app; print('ok')"

      - name: Сборка .exe
        run: pyinstaller --noconfirm --onefile --windowed --name MoexScanner app.py

      - name: Архив с инструкцией
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/MoexScanner.exe release/
          Copy-Item README.md release/
          Compress-Archive -Path release/* -DestinationPath MoexScanner-windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: MoexScanner-windows
          path: MoexScanner-windows.zip

      - name: Релиз (для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MoexScanner-windows.zip
